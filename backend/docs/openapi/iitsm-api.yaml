- description: Local backend
  url: http://localhost:8080
security:
- bearerAuth: []
tags:
- description: "Register, log in, refresh and revoke tokens, current user (M2)"
  name: Auth
- description: "Report, track and work on incidents; lifecycle actions, comments,\
    \ recommendations (M4, M5, M6)"
  name: Incidents
- description: "Technician list, my workload, my queue, my availability (M6)"
  name: Technicians
- description: Recorded SLA violations (M7)
  name: SLA
- description: The append-only audit log (M8)
  name: Audit
- description: Active services and categories for every logged-in user (M3)
  name: Catalog
- description: "Users, roles, technician profiles and skills (M2, M6)"
  name: "Admin: users and technicians"
- description: "Services, dependencies, categories, skills (M3)"
  name: "Admin: catalog"
- description: SLA and escalation policies (M3)
  name: "Admin: SLA and escalation"
- description: "Live settings: strategies, weights, thresholds (M3)"
  name: "Admin: configuration"
- description: "Agreed contract, not built yet; x-module says which module delivers\
    \ it"
  name: Planned
