components:
  schemas:
    AddRoleRequest:
      type: object
      properties:
        administrator:
          $ref: "#/components/schemas/AdministratorRequest"
        roleType:
          type: string
          enum:
          - EMPLOYEE
          - TECHNICIAN
          - ADMINISTRATOR
        technician:
          $ref: "#/components/schemas/TechnicianRequest"
      required:
      - roleType
    AdminUserView:
      type: object
      properties:
        active:
          type: boolean
        administrator:
          $ref: "#/components/schemas/AdministratorView"
        department:
          type: string
        email:
          type: string
        id:
          type: integer
          format: int64
        location:
          type: string
        name:
          type: string
        roles:
          type: array
          items:
            type: string
            enum:
            - EMPLOYEE
            - TECHNICIAN
            - ADMINISTRATOR
        technician:
          $ref: "#/components/schemas/TechnicianView"
    AdministratorInfo:
      type: object
      properties:
        scope:
          type: string
          enum:
          - SYSTEM_ADMIN
          - IT_MANAGER
    AdministratorRequest:
      type: object
      properties:
        scope:
          type: string
          enum:
          - SYSTEM_ADMIN
          - IT_MANAGER
      required:
      - scope
    AdministratorView:
      type: object
      properties:
        scope:
          type: string
          enum:
          - SYSTEM_ADMIN
          - IT_MANAGER
    AssignRequest:
      type: object
      properties:
        technicianId:
          type: integer
          format: int64
    Attachment:
      type: object
      description: "Allowed types png, jpg, jpeg, gif, pdf, txt, log; max 5 MB; max\
        \ 10 per incident"
      properties:
        contentType:
          type: string
        createdAt:
          type: string
          format: date-time
        filename:
          type: string
        id:
          type: integer
          format: int64
        incidentId:
          type: integer
          format: int64
        sizeBytes:
          type: integer
          format: int64
        uploadedBy:
          $ref: "#/components/schemas/Ref"
    AttachmentView:
      type: object
      properties:
        contentType:
          type: string
        createdAt:
          type: string
          format: date-time
        filename:
          type: string
        id:
          type: integer
          format: int64
        incidentId:
          type: integer
          format: int64
        sizeBytes:
          type: integer
          format: int64
        uploadedBy:
          $ref: "#/components/schemas/UserRef"
    AuditEntryView:
      type: object
      properties:
        action:
          type: string
          enum:
          - INCIDENT_CREATED
          - CLASSIFIED
          - PRIORITY_CALCULATED
          - PRIORITY_CHANGED
          - ASSIGNED
          - REASSIGNED
          - ACKNOWLEDGED
          - WORK_STARTED
          - INFO_REQUESTED
          - INFO_PROVIDED
          - RESOLVED
          - VERIFIED
          - CLOSED
          - REOPENED
          - ESCALATED
          - COMMENT_ADDED
          - SLA_WARNING
          - SLA_VIOLATED
          - DUPLICATE_LINKED
          - LOGIN_FAILED
          - ACCESS_DENIED
          - USER_ROLE_CHANGED
          - CONFIG_CHANGED
          - ATTACHMENT_ADDED
          - PASSWORD_RESET_REQUESTED
          - PASSWORD_CHANGED
          - MFA_ENABLED
          - MFA_DISABLED
        actor:
          $ref: "#/components/schemas/Ref"
        description:
          type: string
        id:
          type: integer
          format: int64
        incidentCode:
          type: string
        newState:
          type: string
          enum:
          - NEW
          - CLASSIFIED
          - ASSIGNED
          - ACKNOWLEDGED
          - IN_PROGRESS
          - PENDING_USER_INFO
          - RESOLVED
          - VERIFIED
          - CLOSED
          - REOPENED
        previousState:
          type: string
          enum:
          - NEW
          - CLASSIFIED
          - ASSIGNED
          - ACKNOWLEDGED
          - IN_PROGRESS
          - PENDING_USER_INFO
          - RESOLVED
          - VERIFIED
          - CLOSED
          - REOPENED
        timestamp:
          type: string
          format: date-time
    AuthResponse:
      type: object
      properties:
        accessToken:
          type: string
        expiresInSeconds:
          type: integer
          format: int64
        refreshToken:
          type: string
