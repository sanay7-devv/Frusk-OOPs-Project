# Notification wording (decision DEC-40). One title and one message per event and audience.
#
# Key:    <EVENT>.<audience>.title / .message     (audience: reporter, technician, lead, admin, owner, room)
#         <EVENT>.title / .message                 used when there is no line for the audience
#         <EVENT>.digest.title / .message          one notification that folds several (SLA warnings)
# Placeholders: {code} {title} {priority} {service} {status} {assignee} {reporter} {detail} {clock} {percent}
#               {due} {overdue} {level} {reason} {count} {list}. A placeholder without a value is left empty.
# Titles are cut to 59 characters. The Report teammate may refine the text; keep the placeholders.

INCIDENT_CREATED.reporter.title=Incident {code} received
INCIDENT_CREATED.reporter.message=We received your report "{title}" on {service}. Priority {priority}. We will keep you posted as it moves.

INCIDENT_ASSIGNED.reporter.title={code} assigned to {assignee}
INCIDENT_ASSIGNED.reporter.message=Your incident "{title}" ({priority}) is now handled by {assignee}.
INCIDENT_ASSIGNED.technician.title=New incident {code} ({priority})
INCIDENT_ASSIGNED.technician.message=You were assigned "{title}" on {service}, priority {priority}. Please acknowledge it so the response clock stops.

INCIDENT_ACKNOWLEDGED.reporter.title={code} acknowledged
INCIDENT_ACKNOWLEDGED.reporter.message={assignee} acknowledged your incident "{title}" and will start work.

PRIORITY_CHANGED.title={code} is now {priority}
PRIORITY_CHANGED.message=The priority of "{title}" changed to {priority}. {detail}

INFO_REQUESTED.reporter.title={code}: more information needed
INFO_REQUESTED.reporter.message=The technician needs details on "{title}". Please reply so work can continue; the SLA clock is paused until you do.

INFO_PROVIDED.technician.title={code}: information received
INFO_PROVIDED.technician.message=The reporter replied on "{title}". The SLA clock runs again.

SLA_WARNING.technician.title={code}: SLA at {percent}%
SLA_WARNING.technician.message=The {clock} deadline of "{title}" ({priority}) is at {percent}% and is due {due}.
SLA_WARNING.lead.title={code}: SLA at {percent}%, unassigned
SLA_WARNING.lead.message=Nobody owns "{title}" ({priority}) and its {clock} deadline is at {percent}%, due {due}. Please assign it.
SLA_WARNING.digest.title={count} incidents near their SLA deadline
SLA_WARNING.digest.message={count} incidents reached an SLA warning in this check: {list}.
SLA_WARNING.room.title=SLA warning on {code} ({priority})
SLA_WARNING.room.message="{title}": {clock} deadline at {percent}%, due {due}.

SLA_VIOLATED.title=SLA violated: {code}
SLA_VIOLATED.message=The {clock} deadline of "{title}" ({priority}) was missed by {overdue}.
SLA_VIOLATED.room.title=SLA violated on {code} ({priority})
SLA_VIOLATED.room.message="{title}": the {clock} deadline was missed by {overdue}.

INCIDENT_ESCALATED.owner.title=Escalated to you: {code}
INCIDENT_ESCALATED.owner.message="{title}" ({priority}) was escalated to level {level} and needs you now. {detail}
INCIDENT_ESCALATED.technician.title=Escalated: {code}
INCIDENT_ESCALATED.technician.message="{title}" ({priority}) was escalated to level {level}. {detail}
INCIDENT_ESCALATED.room.title=Escalation on {code} ({priority})
INCIDENT_ESCALATED.room.message="{title}" was raised to level {level}. {detail}

INCIDENT_RESOLVED.reporter.title={code} resolved
INCIDENT_RESOLVED.reporter.message="{title}" was marked resolved. Please confirm the fix or reopen it; it closes by itself if you do not reply.

INCIDENT_VERIFIED.technician.title={code} confirmed
INCIDENT_VERIFIED.technician.message=The reporter confirmed the fix for "{title}".

INCIDENT_CLOSED.reporter.title={code} closed
INCIDENT_CLOSED.reporter.message="{title}" is closed. Thank you for reporting it.

INCIDENT_REOPENED.technician.title={code} reopened
INCIDENT_REOPENED.technician.message="{title}" was reopened. {detail}

DUPLICATE_SUSPECTED.title={code} may be a duplicate
DUPLICATE_SUSPECTED.message="{title}" looks like an incident that was already reported. {detail}

TRIAGE_NEEDED.lead.title=Triage needed: {code}
TRIAGE_NEEDED.lead.message="{title}" ({priority}) could not be assigned automatically ({reason}). Please assign it.
TRIAGE_NEEDED.room.title=Triage needed: {code} ({priority})
TRIAGE_NEEDED.room.message="{title}" waits for a team lead ({reason}).

INCIDENT_ASSIGNED.room.title=P1 assigned: {code}
INCIDENT_ASSIGNED.room.message="{title}" is now with {assignee}.
