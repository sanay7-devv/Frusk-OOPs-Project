<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>{{title}}</title></head>
<body style="margin:0;padding:24px;background:#f3f4f6;font-family:Arial,Helvetica,sans-serif;color:#111827;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;margin:0 auto;background:#ffffff;border-radius:8px;overflow:hidden;">
    <tr>
      <td style="background:#1e3a5f;color:#ffffff;padding:16px 24px;font-size:14px;letter-spacing:.5px;">
        I-ITSM &middot; IT Service Management
      </td>
    </tr>
    <tr>
      <td style="padding:24px;">
        <h1 style="margin:0 0 12px 0;font-size:20px;">{{title}}</h1>
        <p style="margin:0 0 16px 0;font-size:15px;line-height:1.5;">{{message}}</p>
        <p style="margin:0 0 20px 0;font-size:13px;color:#4b5563;">Incident <strong>{{code}}</strong>{{priorityLine}}</p>
        <a href="{{link}}" style="display:inline-block;background:#2563eb;color:#ffffff;text-decoration:none;padding:10px 18px;border-radius:6px;font-size:14px;">Open the incident</a>
      </td>
    </tr>
    <tr>
      <td style="padding:12px 24px;background:#f9fafb;font-size:12px;color:#6b7280;">
        You get this because of your notification settings. Switch it off per event in the app; critical alerts always arrive.
      </td>
    </tr>
  </table>
</body>
</html>
