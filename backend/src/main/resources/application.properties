spring.application.name=iitsm-backend
server.port=8080

# Active profile: dev | demo | test (override with SPRING_PROFILES_ACTIVE)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Database (env vars; defaults match the local `docker run postgres:16` command in docs/ROADMAP.md)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/iitsm}
spring.datasource.username=${DB_USER:iitsm}
spring.datasource.password=${DB_PASSWORD:iitsm}

# JPA: schema is owned by Flyway, Hibernate only validates
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT (access 15 min, refresh 7 days). Secret comes from the environment only.
app.jwt.secret=${JWT_SECRET:}
app.jwt.access-token-minutes=15
app.jwt.refresh-token-days=7

# Login lockout, priority thresholds, strategies etc. live in the app_config table (ConfigKey), not here.

# The auth layer replaces Boot's generated in-memory user ("Using generated security password")
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# CORS: frontend origin only
app.cors.allowed-origin=${CORS_ORIGIN:http://localhost:5173}

# LLM (key from environment only; empty = keyword fallback is used)
app.llm.api-key=${LLM_API_KEY:}
app.ai.primary=LLM

# Mail (mail catcher: Mailpit SMTP on 1025)
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
# fail fast on a dead mail server; the notification channel retries (notification.email.* in app_config)
spring.mail.properties.mail.smtp.connectiontimeout=3000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Actuator: health only for now
management.endpoints.web.exposure.include=health,info
# A mail outage must not mark the whole app DOWN (notifications degrade gracefully); the mail catcher is Mailpit (docker run -p 1025:1025 -p 8025:8025 axllent/mailpit)
management.health.mail.enabled=false

# OpenAPI contract: JSON everywhere (not */*), operations listed in a stable order. Swagger UI: /swagger-ui.html
springdoc.default-produces-media-type=application/json
springdoc.default-consumes-media-type=application/json
springdoc.writer-with-order-by-keys=true
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha

# Every log line carries the request ID set by RequestIdFilter (empty outside a request)
logging.pattern.level=%5p [%X{requestId:-}]

# M12 LLM adapter (DEC-M12): key from the environment only; empty key = LLM path disabled, keyword engine answers
app.llm.model=${LLM_MODEL:claude-haiku-5-5}
app.llm.base-url=${LLM_BASE_URL:https://api.anthropic.com}
app.llm.api-version=${LLM_API_VERSION:2026-10-21}
# anthropic = real API; fake = scripted client for demos and smoke runs (never calls the network)
app.llm.provider=${LLM_PROVIDER:anthropic}

# M14: fail fast when the database is down, so the user gets the 503 SERVICE_UNAVAILABLE body in seconds, not 30 s
spring.datasource.hikari.connection-timeout=${DB_CONNECT_TIMEOUT_MS:3000}

# M14 attachments: files live outside the web root in this folder (env ATTACHMENTS_DIR); the 5 MB rule is checked in
# AttachmentService, the multipart limit is a little higher so the user gets that friendly message
app.attachments.dir=${ATTACHMENTS_DIR:./data/attachments}
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=7MB
