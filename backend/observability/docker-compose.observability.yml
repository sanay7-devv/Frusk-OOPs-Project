# Adds Prometheus (9090) and Grafana (3001) to the running stack. From the repository root:
#
#   export METRICS_TOKEN=$(openssl rand -hex 16)        # any string of 16 or more characters
#   echo -n "$METRICS_TOKEN" > backend/observability/metrics_token
#   docker compose -f deploy/docker-compose.yml -f backend/observability/docker-compose.observability.yml up -d
#
# Volume paths are relative to deploy/ (the first -f file). Grafana: http://localhost:3001 (admin / admin),
# dashboard "I-ITSM service desk". Prometheus: http://localhost:9090.
services:
  backend:
    environment:
      METRICS_TOKEN: ${METRICS_TOKEN:?set METRICS_TOKEN to a string of 16 or more characters}
  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ../backend/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../backend/observability/metrics_token:/etc/prometheus/metrics_token:ro
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - backend
  grafana:
    image: grafana/grafana-oss:11.3.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ../backend/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../backend/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - prometheus
