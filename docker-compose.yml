services:
  postgres:
    image: postgres:16-alpine
    container_name: iitsm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: iitsm
      POSTGRES_USER: iitsm
      POSTGRES_PASSWORD: iitsm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

