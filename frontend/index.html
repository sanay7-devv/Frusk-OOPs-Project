<!doctype html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IITSM Enterprise</title>
    <!-- Google Fonts: Sora (Headings), Geist (Body), JetBrains Mono (Telemetry/Code) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Sora:wght@400;500;600;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet" />
    <!-- Google Identity Services (Google Sign-In) SDK -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <style>
      /* Thin, low-contrast scrollbars stay out of the way of the content. */
      * {
        scrollbar-width: thin;
        scrollbar-color: rgba(148, 163, 184, 0.32) transparent;
      }
      ::-webkit-scrollbar,
      *::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track,
      *::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb,
      *::-webkit-scrollbar-thumb {
        background: rgba(148, 163, 184, 0.3);
        border-radius: 9999px;
        transition: background-color 0.15s ease;
      }
      ::-webkit-scrollbar-thumb:hover,
      *::-webkit-scrollbar-thumb:hover {
        background: rgba(148, 163, 184, 0.52);
      }
      ::-webkit-scrollbar-thumb:active,
      *::-webkit-scrollbar-thumb:active {
        background: rgba(148, 163, 184, 0.68);
      }
      ::-webkit-scrollbar-corner,
      *::-webkit-scrollbar-corner {
        background: transparent;
      }
    </style>
</head>

<body style="background-color: #090d16; color: #dfe2ef; margin: 0; padding: 0;">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>

</html>
