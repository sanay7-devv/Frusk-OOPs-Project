<!doctype html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IITSM Enterprise</title>
    <!-- Google Fonts: Sora (Headings), Geist (Body), JetBrains Mono (Telemetry/Code) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Sora:wght@400;500;600;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet" />
    <!-- Google Identity Services (Google Sign-In) SDK -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <style>
      /* Luminary Kinetic Glassmorphic Scrollbars */
      * {
        scrollbar-width: thin;
        scrollbar-color: rgba(192, 193, 255, 0.22) rgba(10, 14, 23, 0.55);
      }
      ::-webkit-scrollbar,
      *::-webkit-scrollbar {
        width: 7px;
        height: 7px;
      }
      ::-webkit-scrollbar-track,
      *::-webkit-scrollbar-track {
        background: rgba(10, 14, 23, 0.55);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-radius: 9999px;
      }
      ::-webkit-scrollbar-thumb,
      *::-webkit-scrollbar-thumb {
        background: rgba(192, 193, 255, 0.18);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 9999px;
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      }
      ::-webkit-scrollbar-thumb:hover,
      *::-webkit-scrollbar-thumb:hover {
        background: linear-gradient(135deg, rgba(99, 102, 241, 0.6) 0%, rgba(6, 182, 212, 0.6) 100%);
        border-color: rgba(99, 102, 241, 0.75);
        box-shadow: 0 0 14px rgba(99, 102, 241, 0.6), inset 0 0 6px rgba(255, 255, 255, 0.3);
      }
      ::-webkit-scrollbar-thumb:active,
      *::-webkit-scrollbar-thumb:active {
        background: linear-gradient(135deg, rgba(6, 182, 212, 0.8) 0%, rgba(99, 102, 241, 0.8) 100%);
        border-color: rgba(6, 182, 212, 0.9);
        box-shadow: 0 0 18px rgba(6, 182, 212, 0.8);
      }
      ::-webkit-scrollbar-corner,
      *::-webkit-scrollbar-corner {
        background: transparent;
      }
    </style>
</head>

<body style="background-color: #090d16; color: #dfe2ef; margin: 0; padding: 0;">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>

</html>
