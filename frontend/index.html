<!doctype html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IITSM Enterprise</title>
    <!-- Google Fonts: Sora (Headings), Geist (Body), JetBrains Mono (Telemetry/Code) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Sora:wght@400;500;600;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet" />
    <!-- Google Identity Services (Google Sign-In) SDK -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <style>
      /* Luminary Kinetic Glassmorphic Scrollbars */
      ::-webkit-scrollbar {
        width: 7px;
        height: 7px;
      }
      ::-webkit-scrollbar-track {
        background: rgba(9, 13, 22, 0.7);
        backdrop-filter: blur(10px);
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.12);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 9999px;
        backdrop-filter: blur(16px);
        transition: all 0.2s ease-in-out;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(99, 102, 241, 0.45);
        border-color: rgba(99, 102, 241, 0.6);
        box-shadow: 0 0 12px rgba(99, 102, 241, 0.5);
      }
      ::-webkit-scrollbar-thumb:active {
        background: rgba(6, 182, 212, 0.6);
        border-color: rgba(6, 182, 212, 0.8);
      }
      ::-webkit-scrollbar-corner {
        background: transparent;
      }
      /* Firefox */
      * {
        scrollbar-width: thin;
        scrollbar-color: rgba(255, 255, 255, 0.15) rgba(9, 13, 22, 0.7);
      }
    </style>
</head>

<body style="background-color: #090d16; color: #dfe2ef; margin: 0; padding: 0;">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>

</html>
