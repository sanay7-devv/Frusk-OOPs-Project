# demo profile: seed + demo overrides, short timers for the recorded demo
spring.flyway.locations=classpath:db/migration,classpath:db/seed,classpath:db/demo

app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}

# SLA monitor 30 s, escalation monitor 15 s (escalation timeout 1 min and auto-verify 2 min live in app_config / db/demo)
app.sla.monitor-interval-seconds=30
app.escalation.monitor-interval-seconds=15
app.autoverify.monitor-interval-seconds=30

logging.level.com.iitsm=INFO
